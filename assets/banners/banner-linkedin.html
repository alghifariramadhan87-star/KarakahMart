<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner - Minimalist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(135deg, #ffffff 0%, #f0fdfb 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 60px;
            position: relative;
            overflow: hidden;
        }

        .banner::before {
            content: '';
            position: absolute;
            right: -100px;
            top: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .banner::after {
            content: '';
            position: absolute;
            left: -80px;
            bottom: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        .content {
            flex: 1;
            z-index: 1;
            max-width: 700px;
        }

        .badge {
            display: inline-block;
            background: rgba(20, 184, 166, 0.1);
            border: 1px solid #14b8a6;
            color: #14b8a6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .headline {
            font-size: 48px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .education {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }

        .visual {
            flex: 1;
            z-index: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .circle {
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(20, 184, 166, 0.2);
            position: relative;
        }

        .circle::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .icon {
            position: relative;
            z-index: 1;
            font-size: 100px;
            color: white;
            opacity: 0.95;
        }

        .responsive-marker {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: #cbd5e1;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="content">
            <div class="badge">UI/UX Designer</div>
            <h1 class="headline">Alghifari Ramadhan</h1>
            <p class="subtitle">Digital Designer</p>
            <p class="education">S1 Teknik Informatika • UPI YPTK Padang</p>
        </div>
        <div class="visual">
            <div class="circle">
                <i class="fas fa-palette icon"></i>
            </div>
        </div>
        <div class="responsive-marker">LinkedIn: 1584×396</div>
    </div>
</body>
</html>
