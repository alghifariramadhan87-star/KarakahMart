<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Banner - Minimalist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .banner {
            width: 1920px;
            height: 400px;
            background: linear-gradient(135deg, #ffffff 0%, #f0fdfb 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 100px;
            position: relative;
            overflow: hidden;
        }

        .banner::before {
            content: '';
            position: absolute;
            right: -200px;
            top: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .banner::after {
            content: '';
            position: absolute;
            left: -100px;
            bottom: -120px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        .content {
            flex: 1;
            z-index: 1;
            max-width: 900px;
        }

        .label {
            font-size: 13px;
            color: #14b8a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .headline {
            font-size: 64px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 22px;
            color: #64748b;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .education {
            font-size: 16px;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .skills {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .skill-tag {
            background: rgba(20, 184, 166, 0.1);
            color: #14b8a6;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(20, 184, 166, 0.2);
        }

        .visual {
            flex: 1;
            z-index: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .circle {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(20, 184, 166, 0.2);
            position: relative;
        }

        .circle::before {
            content: '';
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .icon {
            position: relative;
            z-index: 1;
            font-size: 110px;
            color: white;
            opacity: 0.95;
        }

        .responsive-marker {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 11px;
            color: #cbd5e1;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="content">
            <div class="label">UI/UX Designer & Developer</div>
            <h1 class="headline">Alghifari Ramadhan</h1>
            <p class="subtitle">Digital Designer</p>
            <p class="education">📍 Padang, Indonesia • S1 Teknik Informatika</p>

            <div class="skills">
                <span class="skill-tag">🎨 UI/UX Design</span>
                <span class="skill-tag">💻 Web Development</span>
                <span class="skill-tag">🎯 User Experience</span>
            </div>
        </div>
        <div class="visual">
            <div class="circle">
                <i class="fas fa-code icon"></i>
            </div>
        </div>
        <div class="responsive-marker">GitHub: 1920×400</div>
    </div>
</body>
</html>
