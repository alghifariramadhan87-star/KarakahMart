<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Detail produk pilihan dari KarakahMart.">
  <title>Detail produk | KarakahMart</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="product">
  <a href="#main" class="skip-link">Lewati ke konten</a>
  <header class="site-header"><div class="shell header-main">
    <a class="brand" href="index.html" aria-label="KarakahMart beranda"><img class="brand-symbol" src="assets/favicon.svg" alt=""><span class="brand-wordmark">Karakah<span>Mart</span></span></a>
    <form class="search" action="index.html" role="search"><label class="visually-hidden" for="searchInput">Cari produk</label><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="searchInput" name="q" type="search" placeholder="Cari produk, kategori, dan lainnya"><button type="submit" aria-label="Cari"><i class="ph ph-arrow-right" aria-hidden="true"></i></button></form>
    <div class="header-actions"><a class="account-link" href="login.html" data-account-link aria-label="Masuk ke akun KarakahMart"><i class="ph ph-user" aria-hidden="true"></i><span data-account-label>Masuk</span></a><a class="cart-button" href="cart.html"><i class="ph ph-shopping-cart-simple" aria-hidden="true"></i><span>Keranjang</span><b data-cart-count>0</b></a></div>
  </div></header>
  <main id="main" class="shell page-main">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Beranda</a><i class="ph ph-caret-right" aria-hidden="true"></i><span>Detail produk</span></nav>
    <section class="product-detail" id="productDetail" aria-live="polite"></section>
    <section class="detail-description" id="detailDescription"></section>
    <section class="related-products store-section" id="relatedProducts" aria-live="polite" hidden></section>
  </main>
  <footer class="simple-footer"><div class="shell"><a class="brand" href="index.html"><img class="brand-symbol" src="assets/favicon.svg" alt=""><span class="brand-wordmark">Karakah<span>Mart</span></span></a><p>© 2026 KarakahMart. Temukan pilihan terbaik untuk kebutuhan Anda.</p></div></footer>
  <p class="sr-status" id="liveStatus" role="status" aria-live="polite"></p>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/shop-pages.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
