<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner - Minimalist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .banner {
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #ffffff 0%, #f0fdfb 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 120px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative elements */
        .banner::before {
            content: '';
            position: absolute;
            right: -200px;
            top: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .banner::after {
            content: '';
            position: absolute;
            left: -100px;
            bottom: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        .content {
            flex: 1;
            z-index: 1;
            max-width: 900px;
        }

        .badge {
            display: inline-block;
            background: rgba(20, 184, 166, 0.1);
            border: 1px solid #14b8a6;
            color: #14b8a6;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .headline {
            font-size: 72px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 24px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .education {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .tagline {
            font-size: 20px;
            color: #14b8a6;
            font-weight: 500;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid rgba(20, 184, 166, 0.2);
            display: inline-block;
        }

        .visual {
            flex: 1;
            z-index: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .circle {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(20, 184, 166, 0.2);
            position: relative;
        }

        .circle::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .icon {
            position: relative;
            z-index: 1;
            font-size: 140px;
            color: white;
            opacity: 0.95;
        }

        /* Responsive fallback marker */
        .responsive-marker {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: #cbd5e1;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="content">
            <div class="badge">UI/UX Designer</div>
            <h1 class="headline">Alghifari Ramadhan</h1>
            <p class="subtitle">Student @ UPI YPTK Padang</p>
            <p class="education">S1 Teknik Informatika - Fakultas Ilmu Komputer</p>
            <p class="tagline">✨ Crafting beautiful and functional digital experiences</p>
        </div>
        <div class="visual">
            <div class="circle">
                <i class="fas fa-palette icon"></i>
            </div>
        </div>
        <div class="responsive-marker">1920×1080</div>
    </div>
</body>
</html>
