<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner - Corporate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .banner {
            width: 1920px;
            height: 1080px;
            background: linear-gradient(to right, #0f172a 0%, #1e293b 50%, #14b8a6 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 120px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background pattern */
        .pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.1) 35px, rgba(255,255,255,.1) 70px);
            pointer-events: none;
        }

        .content {
            flex: 1;
            z-index: 1;
            max-width: 900px;
        }

        .label {
            display: inline-block;
            background: rgba(20, 184, 166, 0.2);
            color: #5eead4;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .headline {
            font-size: 80px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .role {
            font-size: 28px;
            color: #5eead4;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .description {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 32px;
            line-height: 1.6;
            max-width: 600px;
        }

        .education {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(20, 184, 166, 0.3);
        }

        .stats {
            display: flex;
            gap: 60px;
            margin-top: 40px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: #5eead4;
            line-height: 1;
        }

        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .visual {
            flex: 1;
            z-index: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .icon-box {
            width: 320px;
            height: 320px;
            background: rgba(94, 234, 212, 0.1);
            border: 2px solid rgba(94, 234, 212, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(20, 184, 166, 0.1);
        }

        .icon-box i {
            font-size: 120px;
            color: #5eead4;
        }

        .responsive-marker {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.5);
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="pattern"></div>
        <div class="content">
            <div class="label">UI/UX Designer</div>
            <h1 class="headline">Alghifari Ramadhan</h1>
            <p class="role">Aspiring Digital Designer</p>
            <p class="description">Crafting beautiful and functional digital experiences through innovative design and user-centered thinking.</p>

            <div class="stats">
                <div class="stat">
                    <span class="stat-number">S1</span>
                    <span class="stat-label">Teknik Informatika</span>
                </div>
                <div class="stat">
                    <span class="stat-number">UPI</span>
                    <span class="stat-label">YPTK Padang</span>
                </div>
            </div>

            <div class="education">📍 Padang, Indonesia • Student</div>
        </div>
        <div class="visual">
            <div class="icon-box">
                <i class="fas fa-pencil-ruler"></i>
            </div>
        </div>
        <div class="responsive-marker">1920×1080</div>
    </div>
</body>
</html>
